        /* Custom scrollbars */

        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #a8a8a8;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #363636;
        }
        
        /* Story gradient ring */
        .story-ring {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        /* Heart pop animation */
        @keyframes heartPop {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(0deg); opacity: 0.9; }
            100% { transform: scale(1) rotate(0deg); opacity: 0; }
        }
        .animate-heart-pop {
            animation: heartPop 0.8s ease-in-out forwards;
        }

        /* Story progress bar animation */
        @keyframes storyProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .animate-progress {
            animation: storyProgress 5s linear forwards;
        }

        /* Disc Spin Animation for Reels */
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-disc {
            animation: spinSlow 3s linear infinite;
        }

        /* Hide scrollbars for snap scrolling elements */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

            const [darkMode, setDarkMode] = useState(true);
            const [activeTab, setActiveTab] = useState('home'); // home, explore, reels, messages, notifications, profile
            const [posts, setPosts] = useState(initialPosts);
            const [reels, setReels] = useState(initialReels);
            const [stories, setStories] = useState(initialStories);
            const [suggestedUsers, setSuggestedUsers] = useState(initialSuggestedUsers);
            const [chats, setChats] = useState(initialChats);
            const [activeChatId, setActiveChatId] = useState('chat_1');
            const [notifications, setNotifications] = useState(initialNotifications);
            
            // Authenticated User Session via localStorage
            const [currentUser, setCurrentUser] = useState(() => {
                try {
                    const saved = localStorage.getItem('insta_uz_user');
                    return saved ? JSON.parse(saved) : null;
                } catch (e) {
                    return null;
                }
            });
            
            // Global Mute State for Feed Videos
            const [globalMuted, setGlobalMuted] = useState(true);

            // Search Modal & Explore Lightbox State
            const [isSearchOpen, setIsSearchOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [exploreActiveMedia, setExploreActiveMedia] = useState(null);

            // Story Viewer Modal State
            const [activeStoryIndex, setActiveStoryIndex] = useState(null);

            // Create Post Modal State
            const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const handleLogin = (userFormData) => {
                const cleanUsername = `${userFormData.firstName.toLowerCase().trim().replace(/\s+/g, '')}_${userFormData.lastName.toLowerCase().trim().replace(/\s+/g, '')}`;
                const newUser = {
                    id: `user_${Date.now()}`,
                    username: cleanUsername,
                    firstName: userFormData.firstName.trim(),
                    lastName: userFormData.lastName.trim(),
                    name: `${userFormData.firstName.trim()} ${userFormData.lastName.trim()}`,
                    phone: userFormData.phone.trim(),
                    email: userFormData.email.trim(),
                    avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
                    bio: '👨‍💻 Senior Fullstack Developer & Content Creator\n🎥 Raqamli texnologiyalar va sayohat blogi\n📍 Toshkent, O\'zbekiston 🇺🇿',
                    website: 'https://github.com/jasur-dev',
                    postsCount: 24,
                    followersCount: '12.8k',
                    followingCount: 512,
                    isVerified: true
                };
                setCurrentUser(newUser);
                localStorage.setItem('insta_uz_user', JSON.stringify(newUser));
            };

            const handleLogout = () => {
                localStorage.removeItem('insta_uz_user');
                setCurrentUser(null);
            };

            const handleToggleLike = (postId) => {
                setPosts(posts.map(post => {
                    if (post.id === postId) {
                        return {
                            ...post,
                            isLiked: !post.isLiked,
                            likesCount: post.isLiked ? post.likesCount - 1 : post.likesCount + 1
                        };
                    }
                    return post;
                }));
            };

            const handleToggleSave = (postId) => {
                setPosts(posts.map(post => {
                    if (post.id === postId) {
                        return { ...post, isSaved: !post.isSaved };
                    }
                    return post;
                }));
            };

            const handleAddComment = (postId, text) => {
                if (!text.trim()) return;
                setPosts(posts.map(post => {
                    if (post.id === postId) {
                        const newComment = {
                            id: Date.now(),
                            username: currentUser.username,
                            text: text.trim(),
                            time: 'Hozir'
                        };
                        return { ...post, comments: [...post.comments, newComment] };
                    }
                    return post;
                }));
            };

            const handleToggleFollow = (userId) => {
                setSuggestedUsers(suggestedUsers.map(user => {
                    if (user.id === userId) {
                        return { ...user, isFollowing: !user.isFollowing };
                    }
                    return user;
                }));
            };

            const handleCreatePost = (newPostData) => {
                const newPost = {
                    id: `post_${Date.now()}`,
                    username: currentUser.username,
                    userAvatar: currentUser.avatar,
                    location: newPostData.location || 'Toshkent, O\'zbekiston',
                    type: newPostData.type,
                    mediaUrl: newPostData.mediaUrl,
                    posterUrl: newPostData.type === 'video' ? newPostData.mediaUrl : null,
                    duration: newPostData.type === 'video' ? '0:20' : null,
                    likesCount: 1,
                    isLiked: true,
                    isSaved: false,
                    caption: newPostData.caption,
                    timeAgo: 'HOZIR',
                    comments: []
                };

                setPosts([newPost, ...posts]);
                setCurrentUser(prev => ({ ...prev, postsCount: prev.postsCount + 1 }));

                if (newPostData.type === 'video') {
                    const newReel = {
                        id: `reel_${Date.now()}`,
                        username: currentUser.username,
                        userAvatar: currentUser.avatar,
                        videoUrl: newPostData.mediaUrl,
                        likes: '1',
                        comments: '0',
                        shares: '0',
                        audioTrack: `${currentUser.username} • Original Ovozi`,
                        caption: newPostData.caption,
                        isLiked: true,
                        isFollowing: true
                    };
                    setReels([newReel, ...reels]);
                }

                setIsCreateModalOpen(false);
            };

            // If not logged in, render Instagram Registration & Login Auth View
            if (!currentUser) {
                return (
                    <AuthScreen 
                        onLogin={handleLogin} 
                        darkMode={darkMode} 
                        setDarkMode={setDarkMode} 
                    />
                );
            }

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-white dark:bg-black text-gray-900 dark:text-gray-100">
                    
                    {/* Navigation Sidebar */}
                    <Sidebar 
                        activeTab={activeTab} 
                        setActiveTab={setActiveTab} 
                        darkMode={darkMode} 
                        setDarkMode={setDarkMode}
                        setIsCreateModalOpen={setIsCreateModalOpen}
                        isSearchOpen={isSearchOpen}
                        setIsSearchOpen={setIsSearchOpen}
                        currentUser={currentUser}
                        handleLogout={handleLogout}
                    />

                    {/* Main Dynamic Viewport */}
                    <main className="flex-1 max-w-full overflow-x-hidden pb-16 md:pb-0 md:ml-16 lg:ml-64 transition-all duration-300">
                        {isSearchOpen && (
                            <SearchDrawer 
                                searchQuery={searchQuery}
                                setSearchQuery={setSearchQuery}
                                onClose={() => setIsSearchOpen(false)}
                                suggestedUsers={suggestedUsers}
                            />
                        )}

                        {activeTab === 'home' && (
                            <HomeView 
                                stories={stories} 
                                setActiveStoryIndex={setActiveStoryIndex}
                                posts={posts}
                                handleToggleLike={handleToggleLike}
                                handleToggleSave={handleToggleSave}
                                handleAddComment={handleAddComment}
                                currentUser={currentUser}
                                suggestedUsers={suggestedUsers}
                                handleToggleFollow={handleToggleFollow}
                                globalMuted={globalMuted}
                                setGlobalMuted={setGlobalMuted}
                            />
                        )}

                        {activeTab === 'explore' && (
                            <ExploreView 
                                posts={posts} 
                                setExploreActiveMedia={setExploreActiveMedia} 
                            />
                        )}

                        {activeTab === 'reels' && (
                            <ReelsView reels={reels} setReels={setReels} />
                        )}

                        {activeTab === 'messages' && (
                            <MessagesView 
                                chats={chats} 
                                setChats={setChats} 
                                activeChatId={activeChatId} 
                                setActiveChatId={setActiveChatId}
                                currentUser={currentUser}
                            />
                        )}

                        {activeTab === 'notifications' && (
                            <NotificationsView notifications={notifications} />
                        )}

                        {activeTab === 'profile' && (
                            <ProfileView 
                                currentUser={currentUser} 
                                posts={posts.filter(p => p.username === currentUser.username || p.isSaved)}
                                allPosts={posts}
                                setExploreActiveMedia={setExploreActiveMedia}
                                handleLogout={handleLogout}
                            />
                        )}
                    </main>

                    {/* Modals & Overlays */}
                    {activeStoryIndex !== null && (
                        <StoryViewerModal 
                            stories={stories} 
                            activeStoryIndex={activeStoryIndex} 
                            setActiveStoryIndex={setActiveStoryIndex} 
                        />
                    )}

                    {isCreateModalOpen && (
                        <CreatePostModal 
                            onClose={() => setIsCreateModalOpen(false)}
                            onCreate={handleCreatePost}
                        />
                    )}

                    {exploreActiveMedia && (
                        <MediaLightboxModal 
                            media={exploreActiveMedia}
                            onClose={() => setExploreActiveMedia(null)}
                        />
                    )}
                </div>
            );
        }

        // --- AUTHENTICATION SCREEN (Kirish / Ro'yxatdan O'tish) ---
        function AuthScreen({ onLogin, darkMode, setDarkMode }) {
            const [firstName, setFirstName] = useState('');
            const [lastName, setLastName] = useState('');
            const [phone, setPhone] = useState('+998 ');
            const [email, setEmail] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!firstName.trim()) {
                    setErrorMsg('Iltimos, ismingizni kiriting!');
                    return;
                }
                if (!lastName.trim()) {
                    setErrorMsg('Iltimos, familiyangizni kiriting!');
                    return;
                }
                if (!phone.trim() || phone.trim() === '+998') {
                    setErrorMsg('Iltimos, telefon raqamingizni kiriting!');
                    return;
                }
                if (!email.trim() || !email.includes('@')) {
                    setErrorMsg('Iltimos, to\'g\'ri e-mail manzilingizni kiriting!');
                    return;
                }

                setErrorMsg('');
                onLogin({ firstName, lastName, phone, email });
            };

            const fillDemoData = () => {
                setFirstName('Jasur');
                setLastName('Bekmuhammad');
                setPhone('+998 90 123 45 67');
                setEmail('jasur.bekmuhammad@gmail.com');

            return (
                <div className="min-h-screen bg-gray-50 dark:bg-black text-gray-900 dark:text-gray-100 flex items-center justify-center p-4">
                    <div className="w-full max-w-4xl flex items-center justify-center gap-12">
                        
                        {/* Phone Mockup (Desktop Display) */}
                        <div className="hidden md:block relative w-[380px] h-[600px]">
                            <div className="absolute inset-0 bg-gradient-to-tr from-insta-purple via-insta-pink to-insta-orange rounded-[45px] p-2 shadow-2xl">
                                <div className="w-full h-full bg-black rounded-[38px] overflow-hidden relative border-4 border-black">
                                    <img 
                                        src="https://images.unsplash.com/photo-1541872703-74c5e44368f9?w=800&auto=format&fit=crop&q=80" 
                                        className="w-full h-full object-cover opacity-90" 
                                        alt="Instagram Preview" 
                                    />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/30 flex flex-col justify-between p-6 text-white">
                                        <div className="flex items-center justify-between">
                                            <span className="font-bold text-xl tracking-tight">Instagram</span>
                                            <i className="fa-solid fa-play text-pink-500"></i>
                                        </div>
                                        <div className="space-y-2">
                                            <div className="inline-block bg-pink-600/90 text-white text-xs font-semibold px-3 py-1 rounded-full backdrop-blur-md">
                                                 HD Video & Reels Platforma
                                            </div>
                                            <h3 className="text-2xl font-bold leading-tight">Do'stlaringiz va videolaringiz bilan bo'lishing</h3>
                                            <p className="text-xs opacity-80">O'zbekistondagi barcha yangi kontent va do'stlar aloqada.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Login/Signup Form Box */}
                        <div className="w-full max-w-md space-y-4">
                            
                            <div className="bg-white dark:bg-neutral-900 border dark:border-neutral-800 rounded-2xl p-8 shadow-xl space-y-6">
                                
                                <div className="text-center space-y-2">
                                    <h1 className="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-insta-purple via-insta-pink to-insta-orange bg-clip-text text-transparent">
                                        Instagram
                                    </h1>
                                    <p className="text-xs text-gray-500 dark:text-gray-400 font-medium">
                                        Hisobingizga kirish uchun ma'lumotlarni to'ldiring
                                    </p>
                                </div>

                                {errorMsg && (
                                    <div className="bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-300 text-xs p-3 rounded-xl flex items-center space-x-2">
                                        <i className="fa-solid fa-triangle-exclamation text-base"></i>
                                        <span>{errorMsg}</span>
                                    </div>
                                )}

                                <form onSubmit={handleSubmit} className="space-y-3">
                                    
                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">
                                            Ism <span className="text-red-500">*</span>
                                        </label>
                                        <div className="relative">
                                            <i className="fa-regular fa-user absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                                            <input 
                                                type="text" 
                                                placeholder="Masalan: Jasur"
                                                value={firstName}
                                                onChange={(e) => setFirstName(e.target.value)}
                                                className="w-full bg-gray-50 dark:bg-neutral-800 border dark:border-neutral-700 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 transition"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">
                                            Familiya <span className="text-red-500">*</span>
                                        </label>
                                        <div className="relative">
                                            <i className="fa-solid fa-user-tag absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                                            <input 
                                                type="text" 
                                                placeholder="Masalan: Bekmuhammad"
                                                value={lastName}
                                                onChange={(e) => setLastName(e.target.value)}
                                                className="w-full bg-gray-50 dark:bg-neutral-800 border dark:border-neutral-700 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 transition"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">
                                            Telefon raqam <span className="text-red-500">*</span>
                                        </label>
                                        <div className="relative">
                                            <i className="fa-solid fa-phone absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                                            <input 
                                                type="tel" 
                                                placeholder="+998 90 123 45 67"
                                                value={phone}
                                                onChange={(e) => setPhone(e.target.value)}
                                                className="w-full bg-gray-50 dark:bg-neutral-800 border dark:border-neutral-700 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 transition"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">
                                            E-mail manzil <span className="text-red-500">*</span>
                                        </label>
                                        <div className="relative">
                                            <i className="fa-regular fa-envelope absolute left-3.5 top-3.5 text-gray-400 text-sm"></i>
                                            <input 
                                                type="email" 
                                                placeholder="foydalanuvchi@gmail.com"
                                                value={email}
                                                onChange={(e) => setEmail(e.target.value)}
                                                className="w-full bg-gray-50 dark:bg-neutral-800 border dark:border-neutral-700 pl-10 pr-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 transition"
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full bg-gradient-to-r from-insta-pink via-insta-purple to-insta-orange hover:opacity-95 text-white font-bold py-3 rounded-xl shadow-lg transition transform active:scale-98 mt-2 flex items-center justify-center space-x-2"
                                    >
                                        <span>Instagram'ga kirish</span>
                                        <i className="fa-solid fa-arrow-right text-sm"></i>
                                    </button>
                                </form>

                                <div className="pt-2 border-t dark:border-neutral-800 text-center space-y-3">
                                    <button 
                                        type="button" 
                                        onClick={fillDemoData}
                                        className="text-xs font-semibold text-blue-500 hover:text-blue-700"
                                    >
                                        ⚡ Avtomatik to'ldirish (Demo foydalanuvchi)
                                    </button>
                                </div>
                            </div>

                            {/* Theme switcher footer */}
                            <div className="flex justify-between items-center text-xs text-gray-500 px-2">
                                <span>O'zbekcha (O'zbekiston)</span>
                                <button 
                                    onClick={() => setDarkMode(!darkMode)} 
                                    className="flex items-center space-x-1.5 hover:text-black dark:hover:text-white"
                                >
                                    <i className={`fa-solid ${darkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-indigo-600'}`}></i>
                                    <span>{darkMode ? 'Kungi rejim' : 'Tungi rejim'}</span>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // --- SIDEBAR COMPONENT ---
        function Sidebar({ activeTab, setActiveTab, darkMode, setDarkMode, setIsCreateModalOpen, isSearchOpen, setIsSearchOpen, currentUser, handleLogout }) {
            return (
                <aside className="fixed bottom-0 left-0 right-0 z-40 bg-white dark:bg-black border-t dark:border-insta-borderDark md:top-0 md:right-auto md:w-16 lg:w-64 md:border-t-0 md:border-r flex flex-row md:flex-col justify-between p-2 lg:p-4 select-none">
                    
                    <div className="flex flex-col w-full">
                        <div className="hidden md:flex items-center px-3 py-4 mb-4">
                            <span className="text-2xl font-bold tracking-tight bg-gradient-to-r from-insta-purple via-insta-pink to-insta-orange bg-clip-text text-transparent hidden lg:block">
                                Instagram
                            </span>
                            <i className="fa-brands fa-instagram text-2xl text-pink-600 block lg:hidden mx-auto"></i>
                        </div>

                        <nav className="flex flex-row md:flex-col justify-around md:justify-start w-full space-y-0 md:space-y-1">
                            <NavItem 
                                icon="fa-solid fa-house" 
                                label="Asosiy" 
                                active={activeTab === 'home' && !isSearchOpen} 
                                onClick={() => { setActiveTab('home'); setIsSearchOpen(false); }} 
                            />
                            <NavItem 
                                icon="fa-solid fa-magnifying-glass" 
                                label="Qidiruv" 
                                active={isSearchOpen} 
                                onClick={() => setIsSearchOpen(!isSearchOpen)} 
                            />
                            <NavItem 
                                icon="fa-regular fa-compass" 
                                label="Kashf etish" 
                                active={activeTab === 'explore'} 
                                onClick={() => { setActiveTab('explore'); setIsSearchOpen(false); }} 
                            />
                            <NavItem 
                                icon="fa-solid fa-clapperboard text-pink-500" 
                                label="Reels (Videolar)" 
                                badge="10+"
                                active={activeTab === 'reels'} 
                                onClick={() => { setActiveTab('reels'); setIsSearchOpen(false); }} 
                            />
                            <NavItem 
                                icon="fa-regular fa-paper-plane" 
                                label="Xabarlar" 
                                badge="2"
                                active={activeTab === 'messages'} 
                                onClick={() => { setActiveTab('messages'); setIsSearchOpen(false); }} 
                            />
                            <NavItem 
                                icon="fa-regular fa-heart" 
                                label="Bildirishnomalar" 
                                active={activeTab === 'notifications'} 
                                onClick={() => { setActiveTab('notifications'); setIsSearchOpen(false); }} 
                            />
                            <NavItem 
                                icon="fa-regular fa-square-plus" 
                                label="Yaratish" 
                                active={false} 
                                onClick={() => setIsCreateModalOpen(true)} 
                            />
                            <button 
                                onClick={() => { setActiveTab('profile'); setIsSearchOpen(false); }}
                                className={`flex items-center space-x-4 p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-neutral-900 transition w-full ${activeTab === 'profile' ? 'font-bold' : ''}`}
                            >
                                <img 
                                    src={currentUser.avatar} 
                                    alt="Profil" 
                                    className={`w-6 h-6 rounded-full object-cover border ${activeTab === 'profile' ? 'border-2 border-black dark:border-white' : 'border-gray-300'}`} 
                                />
                                <span className="hidden lg:inline text-base truncate">{currentUser.username}</span>
                            </button>
                        </nav>
                    </div>

                    <div className="hidden md:flex flex-col w-full pt-4 border-t dark:border-neutral-800 space-y-1">
                        <button 
                            onClick={() => setDarkMode(!darkMode)}
                            className="flex items-center space-x-4 p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-neutral-900 transition w-full text-gray-700 dark:text-gray-300"
                        >
                            <i className={`fa-solid ${darkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-indigo-600'} text-xl w-6 text-center`}></i>
                            <span className="hidden lg:inline text-sm font-medium">
                                {darkMode ? 'Kungi rejim' : 'Tungi rejim'}
                            </span>
                        </button>

                        <button 
                            onClick={handleLogout}
                            className="flex items-center space-x-4 p-3 rounded-xl hover:bg-red-50 dark:hover:bg-red-950/30 transition w-full text-red-500 font-medium"
                        >
                            <i className="fa-solid fa-right-from-bracket text-xl w-6 text-center"></i>
                            <span className="hidden lg:inline text-sm">Chiqish (Logout)</span>
                        </button>
                    </div>
                </aside>
            );
        }

        function NavItem({ icon, label, active, onClick, badge }) {
            return (
                <button 
                    onClick={onClick}
                    className={`relative flex items-center space-x-4 p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-neutral-900 transition w-full ${active ? 'font-bold text-black dark:text-white' : 'text-gray-700 dark:text-gray-300'}`}
                >
                    <div className="relative flex items-center justify-center w-6 text-xl">
                        <i className={icon}></i>
                        {badge && (
                            <span className="absolute -top-1.5 -right-2 bg-pink-600 text-white text-[9px] font-extrabold rounded-full h-4 min-w-[16px] px-1 flex items-center justify-center">
                                {badge}
                            </span>
                        )}
                    </div>
                    <span className="hidden lg:inline text-base tracking-wide">{label}</span>
                </button>
            );
        }

        // --- SEARCH DRAWER COMPONENT ---
        function SearchDrawer({ searchQuery, setSearchQuery, onClose, suggestedUsers }) {
            const filteredUsers = suggestedUsers.filter(u => 
                u.username.toLowerCase().includes(searchQuery.toLowerCase()) || 
                u.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            return (
                <div className="fixed inset-y-0 left-0 md:left-16 lg:left-64 w-full md:w-96 bg-white dark:bg-neutral-900 border-r dark:border-neutral-800 z-30 shadow-2xl p-4 flex flex-col transition-all duration-300">
                    <div className="flex items-center justify-between pb-4 border-b dark:border-neutral-800">
                        <h2 className="text-xl font-bold">Qidiruv</h2>
                        <button onClick={onClose} className="text-gray-500 hover:text-black dark:hover:text-white">
                            <i className="fa-solid fa-xmark text-xl"></i>
                        </button>
                    </div>

                    <div className="my-4 relative">
                        <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
                        <input 
                            type="text" 
                            placeholder="Profil, hashtag yoki video qidirish..." 
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full bg-gray-100 dark:bg-neutral-800 pl-10 pr-4 py-2 rounded-lg focus:outline-none text-sm"
                        />
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-3">
                        {filteredUsers.map(user => (

        // --- POST CARD COMPONENT ---

            useEffect(() => {
                if (post.type !== 'video' || !videoRef.current) return;

                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            videoRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
                        } else {
                            videoRef.current.pause();
                            setIsPlaying(false);
                        }
                    },
                    { threshold: 0.6 }

                if (containerRef.current) {
                    observer.observe(containerRef.current);
                }

                return () => observer.disconnect();
            }, [post.type]);

            const handleMediaClick = () => {
                const now = Date.now();
                const DOUBLE_TAP_DELAY = 300;
                
                if (now - lastTapRef.current < DOUBLE_TAP_DELAY) {
                    if (!post.isLiked) onLike();
                    setShowBigHeart(true);
                    setTimeout(() => setShowBigHeart(false), 800);
                } else {
                    if (post.type === 'video' && videoRef.current) {
                        if (isPlaying) {
                            videoRef.current.pause();
                            setIsPlaying(false);
                        } else {
                            videoRef.current.play();
                            setIsPlaying(true);
                        }
                    }
                }
                lastTapRef.current = now;

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting && videoRef.current) {
                            videoRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
                        } else if (videoRef.current) {
                            videoRef.current.pause();
                            setIsPlaying(false);
                        }
                    },

                if (videoRef.current) {
                    observer.observe(videoRef.current);
                }

                return () => observer.disconnect();

            const togglePlay = () => {
                if (videoRef.current) {

                        videoRef.current.pause();
                        setIsPlaying(false);
                    } else {
                        videoRef.current.play();
                        setIsPlaying(true);
                    }
                }

            const toggleLikeReel = () => {

                                    className={`flex-1 py-2 rounded-lg transition flex items-center justify-center gap-2 ${postType === 'video' ? 'bg-white dark:bg-neutral-700 text-pink-500 shadow' : 'text-gray-500'}`}
                                >
                                    <i className="fa-solid fa-video"></i> Video / Reel
                                </button>
                                <button 
                                    type="button" 
                                    onClick={() => { setPostType('image'); setMediaUrl(''); }}
                                    className={`flex-1 py-2 rounded-lg transition flex items-center justify-center gap-2 ${postType === 'image' ? 'bg-white dark:bg-neutral-700 text-blue-500 shadow' : 'text-gray-500'}`}
                                >
                                    <i className="fa-solid fa-image"></i> Rasm (Photo)
                                </button>
                            </div>

                            <div className="border-2 border-dashed dark:border-neutral-700 rounded-xl p-4 text-center">
                                <input 
                                    type="file" 
                                    accept={postType === 'video' ? 'video/*' : 'image/*'} 
                                    onChange={handleFileUpload} 
                                    className="hidden" 
                                    id="file-upload"
                                />
                                <label htmlFor="file-upload" className="cursor-pointer flex flex-col items-center space-y-2">
                                    <i className={`fa-solid ${postType === 'video' ? 'fa-film text-pink-500' : 'fa-cloud-arrow-up text-blue-500'} text-3xl`}></i>
                                    <span className="text-xs font-semibold text-gray-700 dark:text-gray-300">
                                        {previewFile ? `Tanlandi: ${previewFile}` : `Kompyuterdan ${postType === 'video' ? 'video (.mp4)' : 'rasm'} faylini tanlang`}
                                    </span>
                                </label>
                            </div>

                            {postType === 'video' && (
                                <div>
                                    <label className="block text-xs font-semibold text-gray-500 mb-1">Yoki namuna videolardan birini tanlang:</label>
                                    <select 
                                        value={mediaUrl}
                                        onChange={(e) => setMediaUrl(e.target.value)}
                                        className="w-full bg-gray-100 dark:bg-neutral-800 p-2.5 rounded-xl text-xs border dark:border-neutral-700"
                                    >
                                        <option value={SAMPLE_VIDEOS.escapes}>1. High Speed Travel Reel (Chorvoq/Chimyon)</option>
                                        <option value={SAMPLE_VIDEOS.blazes}>2. IT Startups & AI Tech Show</option>
                                        <option value={SAMPLE_VIDEOS.bunny}>3. Buxoro & Samarqand Nature Loop</option>
                                        <option value={SAMPLE_VIDEOS.joyrides}>4. UI Motion Design Tutorial</option>
                                        <option value={SAMPLE_VIDEOS.meltdowns}>5. High Mountains Extreme Sports</option>
                                        <option value={SAMPLE_VIDEOS.subaru}>6. Auto Show Test Drive 2026</option>
                                        <option value={SAMPLE_VIDEOS.sintel}>7. Khiva Historical Heritage Animation</option>
                                        <option value={SAMPLE_VIDEOS.tears}>8. Cyber Esports Tashkent Final</option>
                                    </select>
                                </div>
                            )}

                            <div>
                                <label className="block text-xs font-semibold text-gray-500 mb-1">Mediya URL havolasi</label>
                                <input 
                                    type="url" 
                                    placeholder="https://..." 
                                    value={mediaUrl}
                                    onChange={(e) => setMediaUrl(e.target.value)}
                                    className="w-full bg-gray-100 dark:bg-neutral-800 p-3 rounded-xl text-sm focus:outline-none border dark:border-neutral-700"
                                />
                            </div>

                            {mediaUrl && (
                                <div className="h-48 rounded-xl overflow-hidden bg-black flex items-center justify-center">
                                    {postType === 'video' ? (
                                        <video src={mediaUrl} controls className="h-full max-w-full object-cover" />
                                    ) : (
                                        <img src={mediaUrl} className="h-full object-cover" />
                                    )}
                                </div>
                            )}

                            <div>
                                <label className="block text-xs font-semibold text-gray-500 mb-1">Tavsif (Caption)</label>
                                <textarea 
                                    rows="2"
                                    placeholder="Postingiz va video haqida yozing..."
                                    value={caption}
                                    onChange={(e) => setCaption(e.target.value)}
                                    className="w-full bg-gray-100 dark:bg-neutral-800 p-3 rounded-xl text-sm focus:outline-none border dark:border-neutral-700 resize-none"
                                ></textarea>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-gray-500 mb-1">Joylashuv</label>
                                <input 
                                    type="text" 
                                    placeholder="Toshkent, O'zbekiston" 
                                    value={location}
                                    onChange={(e) => setLocation(e.target.value)}
                                    className="w-full bg-gray-100 dark:bg-neutral-800 p-3 rounded-xl text-sm focus:outline-none border dark:border-neutral-700"
                                />
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // --- EXPLORE VIEW ---
        function ExploreView({ posts, setExploreActiveMedia }) {
            const exploreItems = [
                { id: 1, type: 'video', mediaUrl: SAMPLE_VIDEOS.escapes, likes: '42.4K', comments: '1,420' },
                { id: 2, type: 'video', mediaUrl: SAMPLE_VIDEOS.meltdowns, likes: '38.1K', comments: '890' },
                { id: 3, type: 'video', mediaUrl: SAMPLE_VIDEOS.blazes, likes: '54.9K', comments: '2,810' },
                { id: 4, type: 'image', mediaUrl: 'https://images.unsplash.com/photo-1541872703-74c5e44368f9?w=600', likes: '15.6K', comments: '498' },
                { id: 5, type: 'video', mediaUrl: SAMPLE_VIDEOS.joyrides, likes: '29.2K', comments: '1,350' },
                { id: 6, type: 'video', mediaUrl: SAMPLE_VIDEOS.subaru, likes: '64.3K', comments: '2,210' },
                { id: 7, type: 'video', mediaUrl: SAMPLE_VIDEOS.bunny, likes: '21.0K', comments: '780' },
                { id: 8, type: 'video', mediaUrl: SAMPLE_VIDEOS.sintel, likes: '48.7K', comments: '1,620' },
                { id: 9, type: 'image', mediaUrl: 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=600', likes: '19.4K', comments: '640' },
                { id: 10, type: 'video', mediaUrl: SAMPLE_VIDEOS.tears, likes: '82.1K', comments: '3,410' },
                { id: 11, type: 'video', mediaUrl: SAMPLE_VIDEOS.bullrun, likes: '31.5K', comments: '980' },
                { id: 12, type: 'video', mediaUrl: SAMPLE_VIDEOS.fun, likes: '71.2K', comments: '2,900' }
            ];

            return (
                <div className="max-w-screen-lg mx-auto p-4 space-y-4">
                    <div className="flex items-center justify-between">
                        <h2 className="text-xl font-bold flex items-center gap-2">
                            <span>Kashf etish (Explore Grid)</span>
                            <span className="text-xs bg-pink-600 text-white px-2.5 py-0.5 rounded-full font-semibold">12+ Video & Fotosuratlar</span>
                        </h2>
                    </div>

                    <div className="grid grid-cols-3 gap-2 sm:gap-4">
                        {exploreItems.map((item) => (
                            <div 
                                key={item.id} 
                                onClick={() => setExploreActiveMedia(item)}
                                className="relative aspect-square bg-gray-200 dark:bg-neutral-800 group rounded-xl overflow-hidden cursor-pointer shadow-sm"
                            >
                                {item.type === 'video' ? (
                                    <>
                                        <video src={item.mediaUrl} muted className="w-full h-full object-cover" />
                                        <span className="absolute top-2.5 right-2.5 bg-black/60 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs backdrop-blur-sm">
                                            <i className="fa-solid fa-play ml-0.5"></i>
                                        </span>
                                    </>
                                ) : (
                                    <img src={item.mediaUrl} className="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                                )}

                                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center space-x-6 text-white font-bold">
                                    <span className="flex items-center space-x-1.5"><i className="fa-solid fa-heart text-red-500"></i> <span>{item.likes}</span></span>
                                    <span className="flex items-center space-x-1.5"><i className="fa-solid fa-comment"></i> <span>{item.comments}</span></span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- MEDIA LIGHTBOX MODAL ---
        function MediaLightboxModal({ media, onClose }) {
            return (
                <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 backdrop-blur-md">
                    <button onClick={onClose} className="absolute top-6 right-6 text-white text-3xl hover:opacity-75">
                        <i className="fa-solid fa-xmark"></i>
                    </button>
                    <div className="w-full max-w-3xl bg-black rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center border dark:border-neutral-800">
                        {media.type === 'video' ? (
                            <video src={media.mediaUrl} controls autoPlay loop className="max-h-[82vh] w-full object-contain" />
                        ) : (
                            <img src={media.mediaUrl} className="max-h-[82vh] w-full object-contain" />
                        )}
                    </div>
                </div>
            );
        }

        // --- MESSAGES VIEW ---
        function MessagesView({ chats, setChats, activeChatId, setActiveChatId, currentUser }) {
            const activeChat = chats.find(c => c.id === activeChatId) || chats[0];
            const [messageText, setMessageText] = useState('');

            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!messageText.trim()) return;

                const newMsg = {
                    id: Date.now(),
                    sender: currentUser.username,
                    text: messageText,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setChats(chats.map(chat => {
                    if (chat.id === activeChatId) {
                        return { ...chat, messages: [...chat.messages, newMsg] };
                    }
                    return chat;
                }));

                setMessageText('');
            };

            return (
                <div className="max-w-screen-xl mx-auto h-[calc(100vh-4rem)] md:h-screen p-2 sm:p-6">
                    <div className="bg-white dark:bg-black border dark:border-neutral-800 rounded-2xl h-full flex overflow-hidden shadow-sm">
                        <div className="w-full md:w-80 border-r dark:border-neutral-800 flex flex-col">
                            <div className="p-4 border-b dark:border-neutral-800 flex justify-between items-center">
                                <h2 className="font-bold text-lg">{currentUser.username}</h2>
                                <i className="fa-regular fa-pen-to-square text-xl cursor-pointer"></i>
                            </div>

                            <div className="flex-1 overflow-y-auto divide-y dark:divide-neutral-900">
                                {chats.map(chat => (
                                    <div 
                                        key={chat.id} 
                                        onClick={() => setActiveChatId(chat.id)}
                                        className={`p-3.5 flex items-center space-x-3 cursor-pointer hover:bg-gray-50 dark:hover:bg-neutral-900 transition ${activeChatId === chat.id ? 'bg-gray-100 dark:bg-neutral-800/70' : ''}`}
                                    >
                                        <div className="relative">
                                            <img src={chat.avatar} className="w-12 h-12 rounded-full object-cover" />
                                            {chat.online && <span className="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-white dark:border-black rounded-full"></span>}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <p className="font-semibold text-sm truncate">{chat.name}</p>
                                            <p className="text-xs text-gray-500 truncate">{chat.messages[chat.messages.length - 1]?.text}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {activeChat ? (
                            <div className="hidden md:flex flex-1 flex-col justify-between">
                                <div className="p-4 border-b dark:border-neutral-800 flex justify-between items-center">
                                    <div className="flex items-center space-x-3">
                                        <img src={activeChat.avatar} className="w-10 h-10 rounded-full object-cover" />
                                        <div>
                                            <p className="font-bold text-sm">{activeChat.name}</p>
                                            <p className="text-xs text-gray-400">{activeChat.online ? 'Tarmoqda' : 'Yaqinda bo\'lgan'}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-1 p-4 overflow-y-auto space-y-3">
                                    {activeChat.messages.map(msg => (
                                        <div key={msg.id} className={`flex ${msg.sender === currentUser.username ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-xs px-4 py-2.5 rounded-2xl text-sm ${
                                                msg.sender === currentUser.username ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-200 dark:bg-neutral-800 text-gray-900 dark:text-gray-100 rounded-bl-none'
                                            }`}>
                                                <p>{msg.text}</p>
                                                <span className="text-[9px] block text-right mt-1 opacity-70">{msg.time}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <form onSubmit={handleSendMessage} className="p-4 border-t dark:border-neutral-800 flex items-center space-x-3">
                                    <input 
                                        type="text" 
                                        placeholder="Xabar yozing..." 
                                        value={messageText}
                                        onChange={(e) => setMessageText(e.target.value)}
                                        className="flex-1 bg-gray-100 dark:bg-neutral-800 px-4 py-2.5 rounded-full text-sm focus:outline-none"
                                    />
                                    <button type="submit" disabled={!messageText.trim()} className="text-blue-500 font-bold text-sm disabled:opacity-40">Yuborish</button>
                                </form>
                            </div>
                        ) : (
                            <div className="hidden md:flex flex-1 items-center justify-center text-gray-400">
                                Xabar tanlanmagan
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- NOTIFICATIONS VIEW ---
        function NotificationsView({ notifications }) {
            return (
                <div className="max-w-screen-md mx-auto p-4 sm:p-6 space-y-4">
                    <h2 className="text-xl font-bold border-b dark:border-neutral-800 pb-3">Bildirishnomalar</h2>
                    <div className="space-y-3">
                        {notifications.map(n => (
                            <div key={n.id} className="flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 dark:hover:bg-neutral-900 border dark:border-neutral-800/50">
                                <div className="flex items-center space-x-3">
                                    <img src={n.avatar} className="w-11 h-11 rounded-full object-cover" />
                                    <div className="text-sm">
                                        <span className="font-semibold mr-1.5">{n.username}</span>
                                        <span className="text-gray-700 dark:text-gray-300">{n.content}</span>
                                        <span className="text-xs text-gray-400 ml-2">{n.time}</span>
                                    </div>
                                </div>
                                {n.postImage && <img src={n.postImage} className="w-10 h-10 rounded object-cover" />}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- PROFILE VIEW ---
        function ProfileView({ currentUser, posts, allPosts, setExploreActiveMedia, handleLogout }) {
            const [activeProfileTab, setActiveProfileTab] = useState('posts');

            return (
                <div className="max-w-screen-md mx-auto p-4 sm:p-8 space-y-8">
                    <div className="flex flex-col sm:flex-row items-center sm:items-start gap-6 sm:gap-12">
                        <img src={currentUser.avatar} className="w-24 h-24 sm:w-36 sm:h-36 rounded-full object-cover border-2 border-pink-500 p-1" />
                        <div className="flex-1 space-y-4 text-center sm:text-left">
                            <div className="flex flex-col sm:flex-row items-center gap-3">
                                <h1 className="text-xl font-normal flex items-center gap-1">
                                    @{currentUser.username}
                                    {currentUser.isVerified && <i className="fa-solid fa-circle-check text-blue-500 text-sm"></i>}
                                </h1>
                                <div className="flex items-center space-x-2">
                                    <button className="bg-gray-100 dark:bg-neutral-800 px-4 py-1.5 rounded-lg text-sm font-semibold">Tahrirlash</button>
                                    <button 
                                        onClick={handleLogout}
                                        className="bg-red-100 dark:bg-red-950/60 text-red-600 dark:text-red-400 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-200 transition flex items-center gap-1.5"
                                    >
                                        <i className="fa-solid fa-right-from-bracket"></i>
                                        <span>Chiqish</span>
                                    </button>
                                </div>
                            </div>

                            <div className="flex justify-center sm:justify-start space-x-8 text-sm">
                                <div><span className="font-bold">{currentUser.postsCount}</span> postlar</div>
                                <div><span className="font-bold">{currentUser.followersCount}</span> obunachilar</div>
                                <div><span className="font-bold">{currentUser.followingCount}</span> obunalar</div>
                            </div>

                            {/* Registered User Profile Details Box */}
                            <div className="bg-gray-50 dark:bg-neutral-900 border dark:border-neutral-800 p-4 rounded-xl text-xs space-y-2 text-left">
                                <div className="flex items-center space-x-2 text-gray-800 dark:text-gray-200 font-semibold text-sm">
                                    <i className="fa-solid fa-id-card text-pink-500"></i>
                                    <span>{currentUser.name} ({currentUser.firstName} {currentUser.lastName})</span>
                                </div>
                                <div className="flex items-center space-x-2 text-gray-500">
                                    <i className="fa-solid fa-phone text-blue-500"></i>
                                    <span>Telefon: {currentUser.phone}</span>
                                </div>
                                <div className="flex items-center space-x-2 text-gray-500">
                                    <i className="fa-regular fa-envelope text-purple-500"></i>
                                    <span>E-mail: {currentUser.email}</span>
                                </div>
                            </div>

                            <div className="text-sm space-y-1">
                                <p className="whitespace-pre-line text-gray-700 dark:text-gray-300">{currentUser.bio}</p>
                            </div>
                        </div>
                    </div>

                    {/* Profile Tabs */}
                    <div className="border-t dark:border-neutral-800 pt-2">
                        <div className="flex justify-center space-x-12 text-xs font-semibold uppercase tracking-wider text-gray-400">
                            <button 
                                onClick={() => setActiveProfileTab('posts')}
                                className={`flex items-center space-x-2 py-2 border-t-2 ${activeProfileTab === 'posts' ? 'border-black dark:border-white text-black dark:text-white' : 'border-transparent'}`}
                            >
                                <i className="fa-solid fa-border-all"></i>
                                <span>Postlar</span>
                            </button>
                            <button 
                                onClick={() => setActiveProfileTab('reels')}
                                className={`flex items-center space-x-2 py-2 border-t-2 ${activeProfileTab === 'reels' ? 'border-black dark:border-white text-black dark:text-white' : 'border-transparent'}`}
                            >
                                <i className="fa-solid fa-clapperboard text-pink-500"></i>
                                <span>Reels (Videolar)</span>
                            </button>
                            <button 
                                onClick={() => setActiveProfileTab('saved')}
                                className={`flex items-center space-x-2 py-2 border-t-2 ${activeProfileTab === 'saved' ? 'border-black dark:border-white text-black dark:text-white' : 'border-transparent'}`}
                            >
                                <i className="fa-regular fa-bookmark"></i>
                                <span>Saqlanganlar</span>
                            </button>
                        </div>

                        {/* Grid Display */}
                        <div className="grid grid-cols-3 gap-1 sm:gap-4 mt-4">
                            {(activeProfileTab === 'posts' 
                                ? posts 
                                : activeProfileTab === 'reels' 
                                ? allPosts.filter(p => p.type === 'video') 
                                : allPosts.filter(p => p.isSaved)
                            ).map(post => (
                                <div 
                                    key={post.id} 
                                    onClick={() => setExploreActiveMedia(post)}
                                    className="relative aspect-square bg-gray-200 dark:bg-neutral-800 group rounded-lg overflow-hidden cursor-pointer"
                                >
                                    {post.type === 'video' ? (
                                        <>
                                            <video src={post.mediaUrl} className="w-full h-full object-cover" />
                                            <span className="absolute top-2 right-2 text-white bg-black/60 rounded-full p-1 text-xs backdrop-blur-sm">
                                                <i className="fa-solid fa-play ml-0.5"></i>
                                            </span>
                                        </>
                                    ) : (
                                        <img src={post.mediaUrl} className="w-full h-full object-cover" />
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // Render React DOM cleanly
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch(err) {
            console.error("Render Error: ", err);
        }
    </script>
</body>
</html>
